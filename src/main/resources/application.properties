spring.application.name=sistema-riego-inteligente

# Configuraci\u00f3n de la Base de Datos (Supabase / PostgreSQL) usando variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraci\u00f3n de HikariCP para PostgreSQL
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Configuraci\u00f3n JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Puerto del Servidor
server.port=${PORT:8080}

# Configuraci\u00f3n de Correo (Mailtrap)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Propiedades adicionales de la aplicaci\u00f3n
app.frontend.url=${FRONTEND_URL}
app.reset.token.minutos=30
app.admin.key=${ADMIN_KEY}
app.mail.from=${MAIL_FROM:noreply@riego.local}